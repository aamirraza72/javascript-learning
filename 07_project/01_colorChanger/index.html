<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="style.css" />
    <title>Background Color Switcher</title>
   
  </head>
  <body>
    <nav>
      <a href="/" id="homeLink">Home</a>
      <a href="https://www.linkedin.com/in/aamir-raza-94899b420/" target="_blank" rel="noopener noreferrer">
        LinkedIn
      </a> <a href="https://github.com/aamirraza72/javascript-learning/tree/main/07_project/01_colorChanger" target="_blank" rel="noopener noreferrer">
        GitHub
      </a>
     
    </nav>

    <div class="canvas">
      <h1>Color Scheme Switcher</h1>
      <button class="color-btn" id="grey">Grey</button>
      <button class="color-btn" id="red">Red</button>
      <button class="color-btn" id="blue">Blue</button>
      <button class="color-btn" id="yellow">Yellow</button>
      <button class="color-btn" id="green">Green</button>

      <p>Current Color: <span id="currentColor">White</span></p>
      <p>Clicks: <span id="count">0</span></p>
      <button id="resetbtn">Reset</button>
      <h2>Try clicking on one of the colors above <span>to change the background color of this page!</span></h2>
    </div>

    <script src="script.js"></script>
  </body>
</html>
